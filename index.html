// SEARCH: route all five Discover modes to the selected free API.
// FIX: choose results from the active API without null from the other API masking valid data.
async function searchOnline(){let source=$('#discoverSource')?.value||discoverSource,mode=$('#discoverMode')?.value||discoverMode,text=$('#discoverSearch')?.value.trim()||'',value=$('#discoverValue')?.value||'',base=source==='drinks'?'https://www.thecocktaildb.com/api/json/v1/1/':'https://www.themealdb.com/api/json/v1/1/';discoverSource=source;discoverMode=mode;discoverQuery=text;discoverLoading=true;discoverError='';render();let url='';if(mode==='random')url=base+'random.php';else if(mode==='name'){if(!text){discoverError='Type a dish name to search.';discoverLoading=false;render();return}url=base+'search.php?s='+encodeURIComponent(text)}else if(mode==='ingredient')url=base+'filter.php?i='+encodeURIComponent(value);else if(mode==='category')url=base+'filter.php?c='+encodeURIComponent(value);else if(mode==='area'&&source==='meals')url=base+'filter.php?a='+encodeURIComponent(value);else if(mode==='glass'&&source==='drinks')url=base+'filter.php?g='+encodeURIComponent(value);try{let resp=await fetch(url);if(!resp.ok)throw Error('Service error');let json=await resp.json(),arr=[];if(source==='meals'&&Array.isArray(json.meals))arr=json.meals;else if(source==='drinks'&&Array.isArray(json.drinks))arr=json.drinks;else if(Array.isArray(json.meals))arr=json.meals;else if(Array.isArray(json.drinks))arr=json.drinks;discoverResults=arr;if(!arr.length)discoverError='No recipes matched that search.';if(mode==='random'&&arr[0]){discoverLoading=false;render();showOnlineDetail(arr[0],source);return}}catch(e){discoverError='The recipe service is unavailable right now.';discoverResults=[]}discoverLoading=false;render()}
function regenerate(){let start=dayStart(today),newMap=new Map(),hasPlan=false;for(let i=0;i<7;i++){let d=new Date(start);d.setDate(d.getDate()+i);let k=keyDate(d),plan=data.mealPlan[k]||{};for(let m of meals){let entry=plan[m],r=entry?.recipeId&&data.recipes.find(x=>x.id===entry.recipeId);if(!r||r.type==='drink')continue;hasPlan=true;let label=`${dayShort[d.getDay()]} ${m}`;for(let ing of r.ingredients){let name=words(ing.name),u=(ing.unit||'pz').toLowerCase(),q=Number(ing.qty)||0;if(u==='kg'){q*=1000;u='g'}else if(u==='l'){q*=1000;u='ml'}else if(u==='lb'){q*=16;u='oz'}let key=name+'|'+u,rec=newMap.get(key);if(!rec){rec={id:rid(),name,qty:0,unit:u,pricePerUnit:ing.pricePerUnit>0?ing.pricePerUnit:null,checked:false,manual:false,sources:[]};newMap.set(key,rec)}rec.qty+=q;if(!(rec.pricePerUnit>0)&&ing.pricePerUnit>0)rec.pricePerUnit=ing.pricePerUnit;if(!rec.sources.includes(label))rec.sources.push(label)}}}if(!hasPlan){toast('No recipe meals in this week yet.');return}let prior=data.shoppingList;for(let x of prior.filter(x=>x.manual)){let name=words(x.name),u=(x.unit||'pz').toLowerCase(),q=+x.qty||0;if(u==='kg'){q*=1000;u='g'}else if(u==='l'){q*=1000;u='ml'}else if(u==='lb'){q*=16;u='oz'}let found=newMap.get(name+'|'+u);if(found){found.qty+=q;found.manual=true;if(!(found.pricePerUnit>0)&&x.pricePerUnit>0)found.pricePerUnit=x.pricePerUnit;found.checked=found.checked||x.checked}else newMap.set(name+'|'+u,{...x,id:x.id||rid(),name,qty:q,unit:u,manual:true,sources:x.sources||[]})}let oldMap=new Map(prior.map(x=>[words(x.name)+'|'+(x.unit||'pz').toLowerCase(),x]));data.shoppingList=[...newMap.entries()].map(([k,x])=>{let old=oldMap.get(k);x.checked=old?.checked||x.checked||false;return x});save();render();toast('Grocery list regenerated')}
function startAddRecipe(r){if(!r)return;if(r.type==='drink'){toast('Drinks are not part of the weekly planner. Add them as manual grocery items if needed.');return}modalShell('Add to your plan',`<label>Date<input class="field" id="planDate" type="date" value="${keyDate(dayStart(today))}"></label><label>Meal<select class="field" id="planType">${meals.map(m=>`<option value="${m}" ${m===r.type?'selected':''}>${icons[m]} ${m}</option>`).join('')}</select></label><p class="muted">${esc(r.name)}</p><div class="modalfoot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-action="confirm-add-plan" data-id="${esc(r.id)}">Add to plan</button></div>`)}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ladle-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function validBackup(x){return x&&typeof x==='object'&&Array.isArray(x.recipes)&&x.recipes.every(r=>r&&typeof r.name==='string'&&recipeTypes.includes(r.type)&&Array.isArray(r.ingredients))&&x.mealPlan&&Array.isArray(x.shoppingList)&&Array.isArray(x.members)&&x.settings&&typeof x.settings==='object'}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;switch(a){case'tab':tab=b.dataset.tab;if(tab==='discover')plannerDiscoverType='';render();break;case'theme':data.settings.theme=data.settings.theme==='dark'?'light':'dark';save();render();break;case'week':weekOffset=b.dataset.dir==='0'?0:weekOffset+(+b.dataset.dir);render();break;case'meal':addPlanModal(b.dataset.date,b.dataset.meal);break;case'save-meal':{
// FIX: ignore stale save actions after the meal modal has closed.
const sel=$('#pickRecipe');if(!sel)break;let pick=sel.value,text=$('#customMeal').value.trim(),date=mealModalDate,type=mealModalType;data.mealPlan[date]??={};data.mealPlan[date][type]=pick?{recipeId:pick}:text?{customText:text}:null;save();$('#modalRoot').innerHTML='';render();toast('Meal saved');break}case'clear-meal':{
// FIX: clear a meal only when its modal supplied a valid date and meal type.
if(typeof mealModalDate!=='string'||!mealModalDate||typeof mealModalType!=='string'||!mealModalType)break;data.mealPlan[mealModalDate]??={};data.mealPlan[mealModalDate][mealModalType]=null;save();$('#modalRoot').innerHTML='';render();toast('Meal cleared');break}case'discover-for-meal':document.getElementById('modalRoot').innerHTML='';tab='discover';discoverSource='meals';discoverMode='name';plannerDiscoverType=mealModalType;discoverQuery='';discoverResults=[];discoverError='';render();document.getElementById('discoverSearch').focus();break;case'new-recipe':recipeModal();break;case'recipe-detail':detailRecipe(data.recipes.find(r=>r.id===id));break;case'quick-add':{let r=data.recipes.find(r=>r.id===id);if(r)startAddRecipe(r);break}case'edit-recipe':recipeModal(data.recipes.find(r=>r.id===id));break;case'delete-recipe':if(confirm('Delete this recipe?')){data.recipes=data.recipes.filter(r=>r.id!==id);Object.values(data.mealPlan).forEach(p=>meals.forEach(m=>{if(p[m]?.recipeId===id)p[m]=null}));save();$('#modalRoot').innerHTML='';render();toast('Recipe deleted')}break;case'add-ing':$('#ingredientsRows').insertAdjacentHTML('beforeend',ingredientRow({name:'',qty:1,unit:'g',pricePerUnit:''}));break;case'remove-ing':if($$('#ingredientsRows .ingrow').length>1)b.closest('.ingrow').remove();break;case'regenerate':regenerate();break;case'clear-checked':data.shoppingList=data.shoppingList.filter(x=>!x.checked);save();render();break;case'check-item':{let x=data.shoppingList[+b.dataset.index];if(x)x.checked=b.checked;save();render();break}case'delete-item':data.shoppingList.splice(+b.dataset.index,1);save();render();toast('Item deleted');break;case'discover-search':searchOnline();break;case'online-detail':{let source=discoverSource,endpoint=source==='drinks'?'https://www.thecocktaildb.com/api/json/v1/1/lookup.php?i=':'https://www.themealdb.com/api/json/v1/1/lookup.php?i=';try{let rr=await fetch(endpoint+encodeURIComponent(id)),jj=await rr.json(),arr=jj.meals||jj.drinks||[];if(!arr.length){toast('Recipe details were not found');break}showOnlineDetail(arr[0],source)}catch{toast('Could not load recipe details')}break}case'import-online':{let meal=window._onlineMeal,source=window._onlineSource||discoverSource;if(!meal)break;let ingredients=[],limit=source==='drinks'?15:20;for(let i=1;i<=limit;i++){let name=meal['strIngredient'+i]?.trim();if(name){let p=normalizedMeasure(meal['strMeasure'+i]);ingredients.push({name,qty:p.qty,unit:p.unit,pricePerUnit:null,rawMeasure:p.rawMeasure})}}let drink=source==='drinks';// FIX: infer direct Discover imports from category; retain planner meal context when present.
let importedType=meals.includes(plannerDiscoverType)?plannerDiscoverType:(discoverMode==='category'&&['breakfast','lunch','dinner'].includes(($('#discoverValue')?.value||'').toLowerCase())?($('#discoverValue').value.toLowerCase()):'dinner');data.recipes.push({id:rid(),name:drink?(meal.strDrink||'Drink'):(meal.strMeal||'Recipe'),type:drink?'drink':importedType,servings:drink?1:2,ingredients,steps:(meal.strInstructions||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),image:drink?(meal.strDrinkThumb||''):(meal.strMealThumb||''),sourceUrl:drink?(meal.strSource||''):(meal.strSource||meal.strYoutube||''),tags:[]});plannerDiscoverType='';// FIX: avoid carrying planner meal type into the next import.
save();$('#modalRoot').innerHTML='';tab='recipes';render();toast('Recipe imported');break}
case'export':exportData();break;case'remove-member':data.members.splice(+b.dataset.index,1);save();render();break;case'reset':if(confirm('Reset all Ladle data? This removes your saved recipes and plans.')&&confirm('Are you sure? This cannot be undone.')){localStorage.removeItem(KEY);data=load();weekOffset=0;save();render();toast('Ladle data reset')}break;case'confirm-add-plan':{
// FIX: guard against an expired Add to plan modal.
const dateInput=$('#planDate'),typeInput=$('#planType');if(!dateInput||!typeInput)break;let dt=dateInput.value,type=typeInput.value;data.mealPlan[dt]??={};data.mealPlan[dt][type]={recipeId:id};save();$('#modalRoot').innerHTML='';tab='planner';render();toast('Added to your plan');break}}
});
document.addEventListener('input',e=>{if(e.target.id==='discoverSearch'){discoverQuery=e.target.value}else if(e.target.id==='recipeSearch'){let p=e.target.selectionStart;recipeQuery=e.target.value;render();let n=$('#recipeSearch');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='discoverSource'){// FIX: clear stale text when switching between Food and Drinks.
discoverSource=e.target.value;discoverQuery='';discoverResults=[];discoverError='';updateDiscoverControls();document.getElementById('discoverSearch').value=''}else if(e.target.id==='discoverMode'){discoverMode=e.target.value;updateDiscoverControls()}else if(e.target.id==='typeFilter'){recipeType=e.target.value;render()}else if(e.target.id==='tagFilter'){tagFilter=e.target.value;render()}else if(e.target.id==='weekStart'){data.settings.weekStartsOn=+e.target.value;weekOffset=0;save();render()}else if(e.target.id==='importFile'&&e.target.files[0]){let fr=new FileReader();fr.onload=()=>{try{let x=JSON.parse(fr.result);if(!validBackup(x))throw Error();let normalized={},discarded=0;Object.entries(x.mealPlan).forEach(([k,v])=>{let d=new Date(k);if(Number.isNaN(+d)){discarded++;return}normalized[keyDate(d)]=v});data={version:1,recipes:x.recipes,mealPlan:normalized,shoppingList:x.shoppingList,members:x.members,settings:{locale:'en-US',currency:'USD',theme:'dark',weekStartsOn:1,...x.settings}};save();render();toast(`Backup imported${discarded?` · ${discarded} invalid dates discarded`:''}`)}catch{toast('That file is not a valid Ladle backup')}e.target.value=''};fr.readAsText(e.target.files[0])}});
document.addEventListener('submit',e=>{if(e.target.id==='manualForm'){e.preventDefault();let f=new FormData(e.target),qty=+f.get('qty'),p=f.get('price');if(!(qty>0)||p!==''&&+p<0){toast('Enter a quantity above zero and a valid price');return}data.shoppingList.push({id:rid(),name:String(f.get('name')).trim(),qty,unit:String(f.get('unit')||'').trim(),pricePerUnit:p===''?null:+p,checked:false,manual:true,sources:[]});save();render();toast('Item added')}else if(e.target.id==='memberForm'){e.preventDefault();let name=new FormData(e.target).get('member').trim();if(name){data.members.push(name);save();render();toast('Member added')}}});
